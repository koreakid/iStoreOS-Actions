name: N1_Custom_BT (iStoreOS 25.12.6 + flippy 6.12.115 + BT/WiFi/passwall2)
on:
  workflow_dispatch:

env:
  VERSION: 25.12.6
  KERNEL: 6.12.115
  ROOTFS_URL: https://github.com/koreakid/iStoreOS-Actions/releases/download/iStoreOS-25.12.6-RELEASE-dhcp/istoreos-armsr-armv8-generic-rootfs.tar.gz
  IMAGEBUILDER_URL: https://github.com/Kwonelee/iStoreOS-Actions/releases/download/iStoreOS-ImageBuilder/20261106-istoreos-imagebuilder-armsr-armv8.Linux-x86_64.tar.zst
  # Cypress 7.45.234 WiFi 固件 (linux-firmware 官方仓库固定 commit f97e3167, 永久不变)
  # 用途: DashPlay board_phicomm_n1.py 校验 7.45.234 版本串后自动把 N1 的 WiFi 切到双链路稳定固件
  CYPRESS_BIN_URL: https://gitlab.com/kernel-firmware/linux-firmware/-/raw/f97e31677523/cypress/cyfmac43455-sdio.bin
  CYPRESS_CLM_URL: https://gitlab.com/kernel-firmware/linux-firmware/-/raw/f97e31677523/cypress/cyfmac43455-sdio.clm_blob
  CYPRESS_BIN_SHA256: d408faa9d0d5b1a2f9912dcea53ab0be48217288e398406d117f0edafe7c3edd
  CYPRESS_CLM_SHA256: 15f50a27020b263d1bea215c8f68d0550d912932d1d9ef19ffd59f18d82dd460
  # passwall2: SF 狡有 3 包已入仓 dist/passwall2/, 其余 9 包从官方 25.12.6 feed 固定 URL 下载
  # (SF 源 master.dl 返回 302, apk 内置 wget 不跟随重定向, 在线安装不可行, 改本地文件安装)

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Download iStoreOS 25.12.6 rootfs (St1 output)
        run: |
          set -e
          mkdir -p bin/targets/armsr/armv8
          curl -L --fail --retry 3 -o bin/targets/armsr/armv8/rootfs.tar.gz "$ROOTFS_URL"
          ls -lh bin/targets/armsr/armv8/

      - name: Inject N1 WiFi/BT firmware + cypress + bluez 5.87 + passwall2
        run: |
          set -e
          cd bin/targets/armsr/armv8

          # ---------- 1. Unpack rootfs into staging tree ----------
          mkdir -p rootfs-stage
          tar -xzf rootfs.tar.gz -C rootfs-stage

          # ---------- 2. Wireless & BT firmware (CYW43455, same chip as RPi 3B+) ----------
          mkdir -p rootfs-stage/lib/firmware/brcm
          base=https://github.com/armbian/firmware/raw/master
          curl -L --fail -o rootfs-stage/lib/firmware/brcm/brcmfmac43455-sdio.bin      "$base/brcm/brcmfmac43455-sdio.bin"
          curl -L --fail -o rootfs-stage/lib/firmware/brcm/brcmfmac43455-sdio.txt      "$base/brcm/brcmfmac43455-sdio.txt"
          curl -L --fail -o rootfs-stage/lib/firmware/brcm/brcmfmac43455-sdio.clm_blob "$base/brcm/brcmfmac43455-sdio.clm_blob"
          curl -L --fail -o rootfs-stage/lib/firmware/brcm/BCM4345C0.hcd               "$base/BCM4345C0.hcd"
          # hci_bcm / btbcm 在不同内核里固件查找路径可能为 brcm/ 或根目录，两处都放
          cp rootfs-stage/lib/firmware/brcm/BCM4345C0.hcd rootfs-stage/lib/firmware/BCM4345C0.hcd

          # ---------- 2b. Cypress 7.45.234 固件 (N1 双链路实测稳定版) ----------
          # N1 板卡专属名 brcm/brcmfmac43455-sdio.phicomm,n1.* 仍走 2018 旧固件时,
          # "连上游热点 + 自己发 AP" 双角色场景 1~1.5 分钟静默失联; 切到 cypress 7.45.234 后稳定.
          # DashPlay 的 board_phicomm_n1.py 每次 supervisor 启动时校验此版本串并自动建立 brcm/ 下的
          # phicomm,n1 -> ../cypress/ 符号链接, 故这里只需放好文件, 无需在镜像里预切换.
          mkdir -p rootfs-stage/lib/firmware/cypress
          curl -L --fail --retry 3 -o rootfs-stage/lib/firmware/cypress/cyfmac43455-sdio.bin      "$CYPRESS_BIN_URL"
          curl -L --fail --retry 3 -o rootfs-stage/lib/firmware/cypress/cyfmac43455-sdio.clm_blob "$CYPRESS_CLM_URL"
          echo "$CYPRESS_BIN_SHA256  rootfs-stage/lib/firmware/cypress/cyfmac43455-sdio.bin"      | sha256sum -c -
          echo "$CYPRESS_CLM_SHA256  rootfs-stage/lib/firmware/cypress/cyfmac43455-sdio.clm_blob" | sha256sum -c -
          grep -aq '7.45.234' rootfs-stage/lib/firmware/cypress/cyfmac43455-sdio.bin \
            || { echo '❌ Cypress 固件版本串不是 7.45.234, board_phicomm_n1.py 将拒绝切换'; exit 1; }

          # WiFi 模块自加载条目（若 rootfs 已有则跳过）
          if [ ! -e rootfs-stage/etc/modules.d/brcmfmac ]; then
            mkdir -p rootfs-stage/etc/modules.d
            printf 'brcmfmac\n' > rootfs-stage/etc/modules.d/brcmfmac
          fi

          # 首次开机自动启用 bluetoothd
          if [ -e rootfs-stage/etc/init.d/bluetoothd ] || true; then
            mkdir -p rootfs-stage/etc/uci-defaults
            printf '#!/bin/sh\n/etc/init.d/bluetoothd enable\n' > rootfs-stage/etc/uci-defaults/99_n1_bluetoothd.sh
            chmod +x rootfs-stage/etc/uci-defaults/99_n1_bluetoothd.sh
          fi

          # 蓝牙模块自加载条目（N1 板载 BCM43455: DT serdev 蓝牙节点需 modprobe hci_uart 后 hci0 才出现）
          printf 'btbcm\nhci_uart\n' > rootfs-stage/etc/modules.d/32-hci-bt

          # ---------- 3. bluez 5.87 from 仓库 dist/bluez-5.87/ (修复 btmgmt 非交互回归) ----------
          # bluez 5.83 的 btmgmt 存在 shell.c 主菜单 pre_run 永不执行的回归 (mgmt socket 不建立,
          # DashPlay power_bluetooth() 失败); 5.84 起上游已修复. 25.12.6 官方 feed 仍为 5.83,
          # 固定使用本仓库 dist/bluez-5.87/ 中已装机验证过的四个 apk (sha256 逐个校验).
          FEED_OFFICIAL=https://downloads.openwrt.org/releases/25.12.6/packages/aarch64_generic/packages
          FEED_MIRROR=https://mirror.nju.edu.cn/openwrt/releases/25.12.6/packages/aarch64_generic/packages
          KMODS_OFFICIAL=https://downloads.openwrt.org/releases/25.12.6/targets/armsr/armv8/kmods/6.12.112-1-67e205f26d0458c4d12f1fd315216398
          KMODS_MIRROR=https://mirror.nju.edu.cn/openwrt/releases/25.12.6/targets/armsr/armv8/kmods/6.12.112-1-67e205f26d0458c4d12f1fd315216398
          fetch_apk() {
            curl -fSL --retry 3 -o "$1.apk" "$2/$1.apk" \
              || curl -fSL --retry 3 -o "$1.apk" "$3/$1.apk"
          }
          # bluez 5.87 四件套来自仓库 dist/ (x86 上无法运行 aarch64 post-install, 用 --no-scripts)
          BLUEZ_DIST="$GITHUB_WORKSPACE/dist/bluez-5.87"
          echo "1269d8f9a471003dfe2639b59d764df95d347c08a12feb070539257c330b9136  $BLUEZ_DIST/bluez-daemon-5.87-r1.apk"      | sha256sum -c -
          echo "0f43762c7077569329fda2e6046e3b74a6275398e7490e17d3e592fddfcfcf70  $BLUEZ_DIST/bluez-libs-5.87-r1.apk"        | sha256sum -c -
          echo "7dc4a4db40499b08e703a2c02f7666ab640c47be1340d3098baeb88a6ad3acd4  $BLUEZ_DIST/bluez-utils-5.87-r1.apk"       | sha256sum -c -
          echo "f52efa324739fe5508254613f0cb50a0e332cad720129da6308e95fcfa1afce2  $BLUEZ_DIST/bluez-utils-extra-5.87-r1.apk" | sha256sum -c -
          # 余下依赖闭包来自官方 25.12.6 feed (libical / bluez 相关 kmod)
          fetch_apk libical-3.0.20-r1         "$FEED_OFFICIAL"  "$FEED_MIRROR"
          fetch_apk kmod-bluetooth-6.12.112-r1 "$KMODS_OFFICIAL" "$KMODS_MIRROR"
          fetch_apk kmod-crypto-ecdh-6.12.112-r1 "$KMODS_OFFICIAL" "$KMODS_MIRROR"
          fetch_apk kmod-crypto-kpp-6.12.112-r1 "$KMODS_OFFICIAL" "$KMODS_MIRROR"
          ls -lh *.apk

          # imagebuilder 自带的 apk 工具（与 rootfs 包数据库同源）
          # 注意: host/bin/apk 是 bash 包装脚本, 真身是隐藏文件 .apk.bin, 脚本通过 ../lib/ 相对路径找自带 ld.so 与库
          curl -L --fail --retry 3 -o imagebuilder.tar.zst "$IMAGEBUILDER_URL"
          mkdir -p ibtools
          # 成员路径: IB(1)/staging_dir(2)/host(3)/bin|lib(4)/文件(5) → strip 3 段保留 bin/ 与 lib/ 布局
          tar --use-compress-program=unzstd -xf imagebuilder.tar.zst -C ibtools --strip-components=3 \
            --wildcards '*staging_dir/host/bin/apk' '*staging_dir/host/bin/.apk.bin' '*staging_dir/host/lib/*'
          test -e ibtools/bin/apk && test -e ibtools/bin/.apk.bin && test -e ibtools/lib/ld-linux-x86-64.so.2 \
            || { echo '❌ apk 工具链未完整解出'; find ibtools -maxdepth 2 | head -10; exit 1; }
          chmod +x ibtools/bin/apk ibtools/bin/.apk.bin
          # 关键: 不设置 LD_LIBRARY_PATH(会污染 /usr/bin-env 的 libc), 直接执行包装脚本, 由其自带 ld.so 运行
          ibtools/bin/apk --version

          # 安装 bluez 5.87 进 rootfs（保持包数据库一致；依赖闭包已随包提供）
          ibtools/bin/apk add \
            --root "$PWD/rootfs-stage" --allow-untrusted --no-scripts --no-network \
            "$BLUEZ_DIST/bluez-daemon-5.87-r1.apk" "$BLUEZ_DIST/bluez-libs-5.87-r1.apk" "$BLUEZ_DIST/bluez-utils-5.87-r1.apk" \
            "$BLUEZ_DIST/bluez-utils-extra-5.87-r1.apk" "$PWD/libical-3.0.20-r1.apk" "$PWD/kmod-bluetooth-6.12.112-r1.apk" \
            "$PWD/kmod-crypto-ecdh-6.12.112-r1.apk" "$PWD/kmod-crypto-kpp-6.12.112-r1.apk"

          BTDBIN=$(find rootfs-stage -type f -name 'bluetoothd' | head -1)
          test -n "$BTDBIN" || { echo "❌ bluetoothd 未安装"; find rootfs-stage -name 'bluetooth*' | head; exit 1; }
          echo "✅ bluetoothd 位于: $BTDBIN"
          # bluez 5.87 自校验: 数据库文本位置随 apk 版本变化, 直接验证 btmgmt 二进制存在即可
          test -x rootfs-stage/usr/bin/btmgmt || { echo '❌ btmgmt 未安装'; exit 1; }
          echo "✅ bluez 5.87 已装进 rootfs (btmgmt 就位)"

          # ---------- 3b. passwall2 (本地 .apk 离线安装, 12 包闭包已在设备模拟验证 EXIT=0) ----------
          # transparent proxy 所需 nft_tproxy/nft_socket 等模块 flippy 6.12.115 内核树已自带, 无需官方 kmod 包.
          # SF 独有 3 包来自仓库 dist/passwall2/ (luci-app-passwall2 / geoview / tcping);
          # 其余 9 包来自官方 25.12.6 feed 固定版本 (v2ray-geoip/xray/sing-box 用官方 feed 版本, 满足依赖).
          PW_DIST="$GITHUB_WORKSPACE/dist/passwall2"
          echo "cb4d6b2909da003b760c364dd9a1d509a4a01efc008c3e5f782598ad67019c34  $PW_DIST/luci-app-passwall2-26.11.3-r1.apk" | sha256sum -c -
          echo "025d00abd16dc08c9d4cfbbcf472b896da27b31528b36db3eba77459be3c9fe1  $PW_DIST/geoview-0.2.9-r1.apk"          | sha256sum -c -
          echo "0e81c20209170eab04b4bd54a0cb1a8a7aa8f836f99d20c14bee6b66a2916932  $PW_DIST/tcping-0.3-r1.apk"           | sha256sum -c -
          fetch_apk coreutils-base64-9.9-r2         "$FEED_OFFICIAL" "$FEED_MIRROR"
          fetch_apk coreutils-nohup-9.9-r2           "$FEED_OFFICIAL" "$FEED_MIRROR"
          fetch_apk coreutils-timeout-9.9-r2         "$FEED_OFFICIAL" "$FEED_MIRROR"
          fetch_apk libyaml-0.2.5-r2                 "$FEED_OFFICIAL" "$FEED_MIRROR"
          fetch_apk lyaml-6.2.7-r2                   "$FEED_OFFICIAL" "$FEED_MIRROR"
          fetch_apk v2ray-geoip-202610050438-r1      "$FEED_OFFICIAL" "$FEED_MIRROR"
          fetch_apk v2ray-geosite-20261009101206-r1  "$FEED_OFFICIAL" "$FEED_MIRROR"
          fetch_apk xray-core-26.10.21-r1            "$FEED_OFFICIAL" "$FEED_MIRROR"
          fetch_apk sing-box-1.13.21-r1              "$FEED_OFFICIAL" "$FEED_MIRROR"
          echo "f9bb0f401e477f8044429e2368917fcd6d425e3f51de76c22c830ea26c52a87b  coreutils-base64-9.9-r2.apk"        | sha256sum -c -
          echo "fdf1552bfbcfc0d6d1ad609b0de950f94e04af21a37c314ffd38ed7726117e12  coreutils-nohup-9.9-r2.apk"        | sha256sum -c -
          echo "f540d53b8f0668d356d40725e62728b4f5a55f65453abcff338aaa9613985595  coreutils-timeout-9.9-r2.apk"        | sha256sum -c -
          echo "495d517fe854187dc283598ebe87499a4a74d49fc43380951dfcfc92323cb822  libyaml-0.2.5-r2.apk"               | sha256sum -c -
          echo "2178c6ca688a49c64816b7a1b4d11eb58719ac49ebf071e1a3c49a59b0b34070  lyaml-6.2.7-r2.apk"                 | sha256sum -c -
          echo "20d98f4a1f7f04fcb779cd7d4e2ad90c804a3c2a89b13ef3a04c6913e31253fe  v2ray-geoip-202610050438-r1.apk"   | sha256sum -c -
          echo "41ab2dbce2b7d4171780ced9a2c532465d6564847e91297fa45fb1818e03f2a7  v2ray-geosite-20261009101206-r1.apk" | sha256sum -c -
          echo "b04316e6f254a3fcb5d6e0bd35e8cd51fd7171f35448f9fe4151b1c17decf731  xray-core-26.10.21-r1.apk"          | sha256sum -c -
          echo "be88435d7ed35e26373e6ceea7d17398de3807c40de1ab1c004d1678a20777b8  sing-box-1.13.21-r1.apk" | sha256sum -c -

          ibtools/bin/apk add \
            --root "$PWD/rootfs-stage" --allow-untrusted --no-scripts --no-network \
            "$PW_DIST/luci-app-passwall2-26.11.3-r1.apk" "$PW_DIST/geoview-0.2.9-r1.apk" "$PW_DIST/tcping-0.3-r1.apk" \
            "$PWD/coreutils-base64-9.9-r2.apk" "$PWD/coreutils-nohup-9.9-r2.apk" "$PWD/coreutils-timeout-9.9-r2.apk" \
            "$PWD/libyaml-0.2.5-r2.apk" "$PWD/lyaml-6.2.7-r2.apk" "$PWD/v2ray-geoip-202610050438-r1.apk" \
            "$PWD/v2ray-geosite-20261009101206-r1.apk" "$PWD/xray-core-26.10.21-r1.apk" "$PWD/sing-box-1.13.21-r1.apk"

          # --no-scripts 跳过了 luci-app-passwall2 的 post-install (aarch64 脚本无法在 x86 runner 执行),
          # 其 uci 默认配置由本仓库 dist/passwall2-default-config/passwall2 补齐 (enabled=0, 开机不启动)
          echo "8e3cad5900452278b5a2e773664662faef39a6763f8423f1864584e4d86a87ee  $GITHUB_WORKSPACE/dist/passwall2-default-config/passwall2" | sha256sum -c -
          cp "$GITHUB_WORKSPACE/dist/passwall2-default-config/passwall2" rootfs-stage/etc/config/passwall2

          PW_BIN=$(find rootfs-stage -type f -name 'xray' | head -1)
          SB_BIN=$(find rootfs-stage -type f -name 'sing-box' | head -1)
          test -n "$PW_BIN" && test -n "$SB_BIN" || { echo '❌ passwall2/xray/sing-box 未安装'; exit 1; }
          echo "✅ passwall2 就位: xray=$PW_BIN sing-box=$SB_BIN"

          # ---------- 4. Repack rootfs (root:root) ----------
          tar --owner=0 --group=0 -czf rootfs.tar.gz -C rootfs-stage .
          rm -rf rootfs-stage ibtools *.apk imagebuilder.tar.zst
          echo "=== 注入结果抽查 ==="
          tar -tzf rootfs.tar.gz | grep -E 'brcmfmac43455|BCM4345C0|cypress/cyfmac43455|modules.d/(brcmfmac|32-hci-bt)|bluetoothd|btattach|libbluetooth|passwall2|xray|sing-box|geoview|v2ray-geo' | head -50
          ls -lh rootfs.tar.gz

      - name: Package N1 firmware (s905d + flippy 6.12.115)
        uses: ophub/amlogic-s9xxx-openwrt@main
        with:
          openwrt_path: bin/targets/armsr/armv8/rootfs.tar.gz
          openwrt_board: s905d
          openwrt_kernel: 6.12.115
          auto_kernel: false
          kernel_repo: ophub/kernel
          kernel_usage: flippy
          builder_name: koreakid

      - name: Rename output images
        run: |
          for FILE in ${{ env.PACKAGED_OUTPUTPATH }}/*.img.gz; do
            FILENAME=$(basename "$FILE")
            NEW_FILENAME=$(echo "$FILENAME" | sed 's/openwrt/istoreos_${{ env.VERSION }}_bt/g')
            if [ "$FILENAME" != "$NEW_FILENAME" ]; then
              mv "$FILE" "${{ env.PACKAGED_OUTPUTPATH }}/$NEW_FILENAME"
              echo "Renamed: $FILENAME -> $NEW_FILENAME"
            fi
          done
          ls -lh ${{ env.PACKAGED_OUTPUTPATH }}/

      - name: Upload to Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: iStoreOS-${{ env.VERSION }}-N1-flippy-${{ env.KERNEL }}
          body: |
            iStoreOS 25.12.6 (apk) + flippy 6.12.115 内核 + N1 蓝牙/WiFi 支持
            - 已注入: brcmfmac43455-sdio 固件 (bin/txt/clm_blob), BCM4345C0.hcd
            - 已注入: cypress/cyfmac43455-sdio 7.45.234 (linux-firmware f97e3167, sha256 校验; DashPlay board_phicomm_n1.py 开机自动切换 N1 专属名到双链路稳定固件)
            - 已预装: bluez-daemon/libs/utils 5.87 (仓库 dist/bluez-5.87, 修复 5.83 btmgmt 非交互 mgmt socket 不建立的回归)
            - 已预置: /etc/modules.d/32-hci-bt (hci_uart + btbcm 开机自动加载)
            - 已预装: passwall2 26.11.3 + xray-core + sing-box (SF 官方源, 默认不自启, LuCI 服务菜单进入配置; nft_tproxy/nft_socket 内核树已自带)
            - 机型: s905d (Phicomm N1)
          files: |
            ${{ env.PACKAGED_OUTPUTPATH }}/*.img.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
